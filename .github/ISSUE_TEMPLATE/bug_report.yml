name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please don't include passwords, cookies or other private data.
        **Security issues:** please don't file them publicly. Use GitHub's "Report a vulnerability" on the Security tab.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. ...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (Wayland)
        - Linux (X11)
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: e.g. Windows 11 23H2, macOS 15.1, Ubuntu 24.04
  - type: input
    id: version
    attributes:
      label: Browser version
      description: From lwb://about, or the release you downloaded.
    validations:
      required: true
  - type: input
    id: site
    attributes:
      label: Affected site (if any)
      placeholder: https://...
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostics
      description: '"Copy diagnostics" on lwb://about, if available.'
      render: text
