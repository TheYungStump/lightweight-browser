<!doctype html><meta charset="utf-8"><title>popup child</title>
<h1>Popup child</h1><p id="p"></p>
<script>
const has = !!window.opener;
document.getElementById('p').textContent = 'window.opener present: ' + has;
document.title = 'child opener=' + has;
if (has) window.opener.postMessage('hello-from-child', '*');
</script>
