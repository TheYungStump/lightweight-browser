# Phase 0b Windows engine spike. Throwaway code, NOT part of the workspace
# (the root Cargo.toml excludes spikes/*). See docs/spikes/phase0b-windows.md.
[package]
name = "engine-spike"
version = "0.0.0"
edition = "2024"
publish = false
license = "FSL-1.1-ALv2"

[workspace]

[dependencies]
tao = "0.37"
wry = "0.57"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
adblock = "0.13"
ureq = "3"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
] }
windows-core = "0.62"

[profile.release]
debug = 1
