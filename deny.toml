# cargo-deny configuration. Run with `cargo deny check`.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Fail on known vulnerabilities; unmaintained/yanked crates are reported too.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# SPEC §5.1. Anything not listed here fails the check. GPL and AGPL are
# deliberately absent, so they're denied.
#
# LGPL is also absent. It's acceptable only for dynamically linked *system*
# libraries, and cargo-deny never sees those: it checks Rust crates only, so
# system libraries such as WebKitGTK (LGPL) aren't checked here at all. If a
# crate ever needs LGPL, add a named entry under `exceptions` with a reason.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
# The allow-list is a policy, not an inventory: don't warn when an allowed
# license isn't used by any dependency yet.
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
# Our own crates are FSL-1.1-ALv2 and `publish = false`; don't check them
# against the third-party allow-list.
ignore = true

[bans]
# Two major versions of the same crate cost binary size and memory: warn so
# it's visible, but don't fail the build.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
